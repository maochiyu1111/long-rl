hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: examples/diffusion_data/video/data2.jsonl
  val_files: examples/diffusion_data/video/val_data2.jsonl
  prompt_key: text
  image_key: images
  max_prompt_length: 2048
  max_response_length: 2048
  train_batch_size: 32
  gen_batch_size: 8
  val_batch_size: 4
  return_full_prompt: true
  shuffle: true
  min_pixels: 262144
  max_pixels: 4194304
  filter_overlong_prompts: false
  trust_remote_code: false
  custom_cls:
    path: verl/utils/dataset/diffusion_dataset.py
    name: DiffusionDataset

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  kl_penalty: flow_grpo
  kl_ctrl:
    kl_coef: 0.01
  filter_groups:
    enable: false

actor_rollout_ref:
  model:
    path: /share/models/Wan2.1-T2V-1.3B-Diffusers
    trust_remote_code: true
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    disco: false
    gradient_accumulation_steps: 4
    ppo_mini_batch_size: 4
    ppo_micro_batch_size_per_gpu: 1
    ulysses_sequence_parallel_size: 2
    use_kl_loss: true
    kl_loss_type: low_var_kl
    kl_loss_coef: 0.01
    loss_agg_mode: token-mean
    timestep_fraction: 0.6
    extra:
      diffusion: true
    fsdp_config:
      param_offload: true
      optimizer_offload: true
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      warmup_style: constant
  rollout:
    name: diffusion
    mode: sync
    n: 8
    temperature: 1.0
    top_p: 0.99
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_model_parallel_size: 1
    log_prob_micro_batch_size_per_gpu: 1
    val_kwargs:
      temperature: 0.5
      n: 1
      do_sample: false
    guidance_scale: 4.5
    resolution: 768
    num_steps: 40
    num_frames: 33
    height: 256
    width: 256
    shift: 5
    use_same_noise: true
    use_group: true
    eta: 0.25
    fps: 8
    num_generations: 8
    vq_coef: 1.0
    mq_coef: 0.0
    bestofn: 2
    sampling_steps: 20
    offloading: true
  ref:
    ulysses_sequence_parallel_size: 1
    diffusion: true
    guidance_scale: 4.5
    scheduler: ${actor_rollout_ref.model.path}/scheduler
    fsdp_config:
      param_offload: true
    log_prob_micro_batch_size_per_gpu: 1

reward_model:
  reward_manager: batch
  reward_kwargs:
    backend: videoalign
    use_videoalign: true
    videoalign:
      load_from_pretrained: ${oc.env:VIDEOALIGN_MODEL_PATH,null}
      load_from_pretrained_step: -1
      device: cuda
      dtype: bfloat16
      use_norm: true

trainer:
  total_epochs: 2
  diffusion_algo: dancegrpo
  project_name: easy_r1
  experiment_name: wan2_1_t2v_1.3b_dancegrpo_case4
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 8
  test_freq: -1
  max_try_make_batch: -1
  val_freq: -1
  val_before_train: false
  val_only: false
  log_val_generations: 3
  save_freq: 10000
  diffusion: true
  disaggregate: false
  pipelined_micro_batch: false

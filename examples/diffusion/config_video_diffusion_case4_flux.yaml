hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: null
  val_files: null
  train_batch_size: 16
  gen_batch_size: 16
  val_batch_size: 1
  dataloader_num_workers: 0
  data_json_path: /home/qzy/models/flux/rl_embeddings/videos2caption.json
  t: 1
  cfg: 0.0

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false

critic:
  enable: false

reward_model:
  enable: false

actor_rollout_ref:
  model:
    path: /home/qzy/models/flux
    trust_remote_code: false
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp
    ppo_mini_batch_size: 16
    ppo_micro_batch_size_per_gpu: 1
    gradient_accumulation_steps: 8
    grad_clip: 0.01
    use_kl_loss: false
    dance_case4_mode: true
    extra:
      diffusion: true
      gradient_checkpointing: true
      dance:
        pretrained_model_name_or_path: /home/qzy/models/flux
        vae_model_path: /home/qzy/models/flux
        model_type: flux
        master_weight_type: fp32
        timestep_fraction: 1.0
        guidance_scale: 3.5
        clip_range: 1.0e-4
        adv_clip_max: 5.0
        timestep_micro_batch: 1
        use_hpsv2: true
        use_pickscore: false
        fsdp_sharding_strategy: full
    fsdp_config:
      param_offload: false
      optimizer_offload: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      warmup_style: constant
      lr_warmup_steps: 0
  rollout:
    name: diffusion
    do_sample: true
    n: 1
    log_prob_micro_batch_size_per_gpu: 1
    guidance_scale: 3.5
    num_steps: 16
    num_frames: 1
    height: 720
    width: 720
    sampling_steps: 16
    shift: 3.0
    eta: 0.3
    fps: 8
    num_generations: 2
    use_group: true
    use_same_noise: true
    bestofn: 2
  ref:
    diffusion: true
    scheduler: /home/qzy/models/Wan2.1-T2V-1.3B-Diffusers/scheduler
    fsdp_config:
      param_offload: false
    log_prob_micro_batch_size_per_gpu: 1

trainer:
  total_epochs: 1
  total_training_steps: null
  max_train_steps: 4
  project_name: flux_case4
  experiment_name: case4_flux
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 8
  test_freq: -1
  val_freq: -1
  val_before_train: false
  save_freq: -1
  diffusion: true
  model_name: flux
  disaggregate: false
  pipelined_micro_batch: false
